# manifest.toml — npth
# See substrate's USAGE.md for the full field reference.

[package]
name             = "npth"
version          = "1.8"
description      = "New portable threads library"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.gnupg.org/software/npth/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["musl"]
provides         = ["npth"]
tags             = ["library", "gnupg"]

[install]
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
