[package]
name             = "terrarium"
version          = "0.1.0"
description      = "Puts an installed Zainium OS on a USB drive, straight from the ISO: it starts any computer, UEFI or BIOS, keeps your files and can be encrypted"
license          = "GPL-3.0"
maintainer       = "Ali Zain <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/Zainium-Dynamics/terrarium"
build_type       = "static"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = []
provides         = ["terrarium"]
tags             = ["usb", "installer", "system"]

[install]
bin     = "/overlayer/zexlib/union/bin"
share   = "/overlayer/zexlib/union/share"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
