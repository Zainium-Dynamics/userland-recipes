# manifest.toml — gpgme-dev
# See substrate's USAGE.md for the full field reference.

[package]
name             = "gpgme-dev"
version          = "2.0.1"
description      = "gpgme headers, pkgconfig"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.gnupg.org/software/gpgme/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["gpgme"]
provides         = ["gpgme-dev"]
tags             = ["library", "gnupg", "dev"]

[install]
bin     = "/overlayer/zexlib/union/bin"
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
share   = "/overlayer/zexlib/union/share"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
