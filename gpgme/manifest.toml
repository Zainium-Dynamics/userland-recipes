# manifest.toml — gpgme
# See substrate's USAGE.md for the full field reference.

[package]
name             = "gpgme"
version          = "2.0.1"
description      = "GnuPG Made Easy, the library interface to gpg"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.gnupg.org/software/gpgme/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["musl", "libgpg-error", "libassuan", "gnupg"]
provides         = ["gpgme"]
tags             = ["library", "gnupg"]

[install]
bin     = "/overlayer/zexlib/union/bin"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
