# manifest.toml — htop
# See substrate's USAGE.md for the full field reference.

[package]
name             = "htop"
version          = "3.5.2"
description      = "Interactive process viewer"
license          = "GPL-2.0-or-later"
maintainer       = "Your Name <you@example.com>"
homepage         = "https://htop.dev/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["musl"]
provides         = ["htop"]
tags             = ["monitor", "system", "terminal"]

[install]
bin     = "/overlayer/zexlib/union/bin"
share   = "/overlayer/zexlib/union/share"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
