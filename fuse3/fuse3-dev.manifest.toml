# manifest.toml — fuse3-dev
# See substrate's USAGE.md for the full field reference.

[package]
name             = "fuse3-dev"
version          = "3.18.3"
description      = "fuse3 headers, pkgconfig"
license          = "LGPL-2.1-only AND GPL-2.0-only"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/libfuse/libfuse"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["fuse3"]
provides         = ["fuse3-dev"]
tags             = ["library", "filesystem", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
