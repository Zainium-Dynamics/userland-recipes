# manifest.toml — json-glib-dev
# See substrate's USAGE.md for the full field reference.

[package]
name             = "json-glib-dev"
version          = "1.10.8"
description      = "json-glib headers, pkgconfig"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://gitlab.gnome.org/GNOME/json-glib"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["json-glib"]
provides         = ["json-glib-dev"]
tags             = ["library", "gnome", "json", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
