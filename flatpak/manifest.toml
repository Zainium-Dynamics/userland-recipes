# manifest.toml — flatpak
# See substrate's USAGE.md for the full field reference.

[package]
name             = "flatpak"
version          = "1.18.4"
description      = "Application deployment framework for desktop apps"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://flatpak.org/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["musl", "glib", "libostree", "appstream", "libarchive", "curl", "libxml2",
                    "libcap", "libseccomp", "zstd", "polkit", "gdk-pixbuf", "libjpeg-turbo", "systemd",
                    "gnupg", "gpgme", "json-glib", "fuse3", "bzip2", "lz4", "libfyaml", "libxmlb",
                    "gtk-update-icon-cache"]
provides         = ["flatpak"]
tags             = ["desktop", "sandboxing", "apps"]

[install]
bin     = "/overlayer/zexlib/union/bin"
lib     = "/overlayer/zexlib/union/lib"
libexec = "/overlayer/zexlib/union/libexec"
share   = "/overlayer/zexlib/union/share"
etc     = "/overlayer/zexlib/union/etc"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
# app catalogs (Flathub's appstream) download right after install, in the background, so the Store has them when opened
# full paths, and no DISPLAY: zex passes the caller's environment, and an empty DISPLAY breaks gpg
post_install = "/overlayer/syshub/bin/env -u DISPLAY /overlayer/syshub/bin/setsid -f /overlayer/syshub/bin/flock -n /run/zex-flatpak-appstream.lock /overlayer/syshub/bin/flatpak update --appstream --system --noninteractive >/dev/null 2>&1 </dev/null"
