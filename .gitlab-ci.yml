# userland-recipes — GitLab CI/CD
#
# Only ever builds packages whose directory actually changed (see
# ci/changed-packages.sh) — this repo can hold thousands of recipes, no
# reason to touch the rest on every pipeline.
#
# No self-hosted runner behind this (yet) — shared runners only, so stay
# mindful of GitLab.com's free-tier CI minutes/timeout. See README.md's
# "A note on CI time".

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - check
  - release

default:
  image: alpine:latest
  before_script:
    # texinfo: several GNU packages' `make all` builds their .info docs as
    # a side effect (no way to opt out per-recipe) — without makeinfo that
    # fails the whole build, not just the docs.
    - apk add --no-cache bash git wget tar gzip xz build-base texinfo cargo
    # substrate is published on crates.io (substrate-zainium, binary name
    # substrate) — install straight from there, no git clone/build needed.
    - cargo install substrate-zainium --locked

check:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      failed=""
      for pkg in $(sh ci/changed-packages.sh); do
        echo "=== check build: $pkg ==="
        sh ci/build.sh "$pkg" || failed="$failed $pkg"
      done
      if [ -n "$failed" ]; then
        echo "FAILED:$failed"
        exit 1
      fi
  artifacts:
    when: on_failure
    expire_in: 1 day
    paths:
      - .zexbuild-staging/

release:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    PUBLISH: "1"
    REQUIRES_SYSHUB: "$REQUIRES_SYSHUB"   # set as a CI/CD variable, current syshub release
  before_script:
    - !reference [default, before_script]
    # zex-ports isn't published to crates.io yet (unlike substrate above) —
    # build from source until it is. R2_ENDPOINT/R2_BUCKET/
    # R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY must be set as protected,
    # masked CI/CD variables on this project — zex-ports reads them
    # straight from the environment, nothing to wire here.
    - git clone --depth 1 https://gitlab.com/alizain.arch/zex-port.git /tmp/zex-ports-src
    - (cd /tmp/zex-ports-src && cargo build --release)
    - cp /tmp/zex-ports-src/target/release/zex-ports /usr/local/bin/zex-ports
  script:
    - |
      failed=""
      for pkg in $(sh ci/changed-packages.sh); do
        echo "=== release build: $pkg ==="
        sh ci/build.sh "$pkg" || failed="$failed $pkg"
      done
      if [ -n "$failed" ]; then
        echo "FAILED:$failed"
        exit 1
      fi
  artifacts:
    when: on_failure
    expire_in: 1 day
    paths:
      - .zexbuild-staging/
