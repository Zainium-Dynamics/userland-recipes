[package]
name             = "glibc"
version          = "2.44"
description      = "GNU C Library in its own directory: glibc's loader, libraries, locales and tools"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.gnu.org/software/libc/"
build_type       = "dynamic"
libc_target      = "gnu"
native           = true

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = []
provides         = ["glibc"]
tags             = ["compat", "library"]

[install]
x86_64-zainium-linux-gnu = "/overlayer/zexlib/union/x86_64-zainium-linux-gnu"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
