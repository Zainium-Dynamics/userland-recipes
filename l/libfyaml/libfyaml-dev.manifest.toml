# manifest.toml — libfyaml-dev
# See substrate's USAGE.md for the full field reference.

[package]
name             = "libfyaml-dev"
version          = "0.9.5"
description      = "libfyaml headers, pkgconfig"
license          = "MIT"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/pantoniou/libfyaml"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["libfyaml"]
provides         = ["libfyaml-dev"]
tags             = ["library", "yaml", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
