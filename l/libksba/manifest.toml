# manifest.toml — libksba
# See substrate's USAGE.md for the full field reference.

[package]
name             = "libksba"
version          = "1.8.1"
description      = "X.509 and CMS library used by GnuPG"
license          = "LGPL-3.0-or-later OR GPL-2.0-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.gnupg.org/software/libksba/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["musl", "libgpg-error"]
provides         = ["libksba"]
tags             = ["library", "gnupg"]

[install]
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
