# manifest.toml — libassuan
# See substrate's USAGE.md for the full field reference.

[package]
name             = "libassuan"
version          = "3.0.2"
description      = "IPC library used by GnuPG components"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.gnupg.org/software/libassuan/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["musl", "libgpg-error"]
provides         = ["libassuan"]
tags             = ["library", "gnupg"]

[install]
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
