# manifest.toml — libxmlb
# See substrate's USAGE.md for the full field reference.

[package]
name             = "libxmlb"
version          = "0.3.27"
description      = "Library to help create and query binary XML blobs"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/hughsie/libxmlb"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["musl", "glib", "xz", "zstd"]
provides         = ["libxmlb"]
tags             = ["library", "xml"]

[install]
bin     = "/overlayer/zexlib/union/bin"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
