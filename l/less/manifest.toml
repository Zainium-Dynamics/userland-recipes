[package]
name             = "less"
version          = "710"
description      = "less: page through text one screen at a time"
license          = "GPL-3.0-or-later OR BSD-2-Clause"
maintainer       = "Ali Zain <heyalizain@gmail.com>"
homepage         = "https://www.greenwoodsoftware.com/less/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["musl", "ncurses", "pcre2"]
provides         = ["less", "lessecho", "lesskey"]
tags             = ["utility", "cli", "text"]

[install]
bin     = "/overlayer/zexlib/union/bin"
lib     = "/overlayer/zexlib/union/lib"
libexec = "/overlayer/zexlib/union/libexec"
etc     = "/overlayer/zexlib/union/etc"
share   = "/overlayer/zexlib/union/share"
var     = "/overlayer/zexlib/union/var"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
