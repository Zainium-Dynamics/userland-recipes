
[package]
name             = "xcb-proto"
version          = "1.17.0"
description      = "XML-XCB protocol descriptions and the xcbgen Python generator (build-time)"
license          = "MIT"
maintainer       = "alizainx <heyalizain@gmail.com>"
homepage         = "https://gitlab.freedesktop.org/xorg/proto/xcbproto"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["musl"]
provides         = ["xcb-proto"]
tags             = ["x11", "protocol", "dev"]

[install]
lib     = "/overlayer/zexlib/union/lib"
share   = "/overlayer/zexlib/union/share"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
