# manifest.toml — bzip2-dev
# See substrate's USAGE.md for the full field reference.

[package]
name             = "bzip2-dev"
version          = "1.0.8"
description      = "bzip2 headers, pkgconfig"
license          = "bzip2-1.0.6"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://sourceware.org/bzip2/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["bzip2"]
provides         = ["bzip2-dev"]
tags             = ["compression", "library", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
