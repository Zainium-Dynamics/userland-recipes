[package]
name             = "graphite2"
version          = "1.3.15"
description      = "Rendering for complex writing systems (SIL Graphite)"
license          = "LGPL-2.1-or-later OR MPL-2.0 OR GPL-2.0-or-later"
maintainer       = "alizainx <heyalizain@gmail.com>"
homepage         = "https://graphite.sil.org"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["musl"]
provides         = ["graphite2"]
tags             = ["library", "fonts"]

[install]
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
