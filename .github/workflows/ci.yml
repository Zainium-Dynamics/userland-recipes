# userland-recipes — GitHub Actions CI/CD
#
# Only ever builds packages whose directory actually changed (see
# ci/changed-packages.sh) — this repo can hold thousands of recipes, no
# reason to touch the rest on every run.
#
# GitHub-hosted runners are free/unlimited on public repos, unlike
# GitLab.com's shared-runner free tier — that's why this lives here.
#
# Jobs run inside an Alpine container, not bare ubuntu-latest — Alpine's
# own gcc/libc IS musl, so every recipe's `--host="$CHOST"` (or, for a
# Makefile-only build like git's, the explicit config.mak LDFLAGS) now
# produces a genuinely musl-linked binary, not a glibc binary wearing a
# musl interpreter string. `libc6-compat` is installed first, before
# anything else runs — GitHub's runner injects a glibc-built Node binary
# into every container job to run JS actions (actions/checkout,
# actions/upload-artifact), which silently fails on bare Alpine without it.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Container prerequisites (glibc shim for actions' Node runtime)
        run: |
          apk add --no-cache libc6-compat git bash
          # actions/checkout sets safe.directory under a *temporary* HOME
          # that only exists during its own (Node) process — every later
          # `run:` step uses the container's real HOME, where that trust
          # entry never landed, so plain `git` calls in later steps
          # (ci/changed-packages.sh, ci/build.sh) fail with "detected
          # dubious ownership". Trust it globally, permanently, up front —
          # this container is single-use/thrown away per job anyway.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          apk add --no-cache build-base texinfo xz zlib-dev curl-dev expat-dev linux-headers rust cargo flex bison rsync elfutils-dev openssl llvm22-dev llvm22-static llvm22-gtest llvm22-test-utils cmake samurai
          # `cargo install` puts binaries in ~/.cargo/bin — the ubuntu-latest
          # setup had dtolnay/rust-toolchain adding this to PATH for free;
          # switching to Alpine's own apk rust/cargo dropped that, so
          # `substrate` (installed below) wasn't found once the CI got far
          # enough to actually call it. GITHUB_PATH persists for every
          # later step in this job, not just this one.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # cargo install/build were recompiling substrate + all its deps
      # from zero on every single run — several minutes wasted on every
      # retry regardless of whether any Rust source actually changed.
      # ~/.cargo/bin already having the right binary makes `cargo
      # install` a same-version no-op instead of a full rebuild.
      - name: Cache cargo (registry + installed binaries)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: cargo-check-${{ runner.os }}-v1

      # substrate is published on crates.io (substrate-zainium, binary
      # name substrate) — install straight from there.
      - name: Install substrate
        run: cargo install substrate-zainium --locked

      - name: Build changed packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pkgs_out="$(mktemp)"
          if ! sh ci/changed-packages.sh > "$pkgs_out"; then
            echo "changed-packages.sh failed:"
            cat "$pkgs_out"
            exit 1
          fi
          failed=""
          for pkg in $(cat "$pkgs_out"); do
            echo "=== check build: $pkg ==="
            sh ci/build.sh "$pkg" || failed="$failed $pkg"
          done
          if [ -n "$failed" ]; then
            echo "FAILED:$failed"
            exit 1
          fi

      - name: Upload staging on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zexbuild-staging
          path: .zexbuild-staging/
          retention-days: 1

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: alpine:latest
    env:
      PUBLISH: "1"
      REQUIRES_SYSHUB: ${{ vars.REQUIRES_SYSHUB }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Container prerequisites (glibc shim for actions' Node runtime)
        run: |
          apk add --no-cache libc6-compat git bash
          # actions/checkout sets safe.directory under a *temporary* HOME
          # that only exists during its own (Node) process — every later
          # `run:` step uses the container's real HOME, where that trust
          # entry never landed, so plain `git` calls in later steps
          # (ci/changed-packages.sh, ci/build.sh) fail with "detected
          # dubious ownership". Trust it globally, permanently, up front —
          # this container is single-use/thrown away per job anyway.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          apk add --no-cache build-base texinfo xz zlib-dev curl-dev expat-dev linux-headers rust cargo flex bison rsync elfutils-dev openssl llvm22-dev llvm22-static llvm22-gtest llvm22-test-utils cmake samurai
          # `cargo install` puts binaries in ~/.cargo/bin — the ubuntu-latest
          # setup had dtolnay/rust-toolchain adding this to PATH for free;
          # switching to Alpine's own apk rust/cargo dropped that, so
          # `substrate` (installed below) wasn't found once the CI got far
          # enough to actually call it. GITHUB_PATH persists for every
          # later step in this job, not just this one.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # cargo install/build were recompiling substrate, zex-ports, and
      # every dependency (aws-sdk-s3 alone took 6+ minutes) from zero on
      # every single run — most of this job's time regardless of whether
      # any Rust source actually changed. ~/.cargo/bin already having
      # the right substrate binary makes `cargo install` a same-version
      # no-op; the zex-ports target/ dir lets cargo skip recompiling
      # unchanged crates instead of starting from an empty target/.
      - name: Cache cargo (registry + installed binaries + zex-ports build)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            /tmp/zex-ports-src/target
          key: cargo-release-${{ runner.os }}-v1

      # zex-ports isn't published to crates.io yet — build from source.
      # substrate is (substrate-zainium) — install straight from there.
      - name: Install substrate + zex-ports
        run: |
          cargo install substrate-zainium --locked
          # The cache step above only restores target/ — .git won't be
          # there on a cache hit (it's not part of the cached path), so
          # check for that specifically, not just the directory existing.
          if [ ! -d /tmp/zex-ports-src/.git ]; then
            cached_target=""
            [ -d /tmp/zex-ports-src/target ] && mv /tmp/zex-ports-src/target /tmp/zex-ports-target-cache && cached_target=1
            rm -rf /tmp/zex-ports-src
            git clone --depth 1 https://gitlab.com/alizain.arch/zex-port.git /tmp/zex-ports-src
            [ -n "$cached_target" ] && mv /tmp/zex-ports-target-cache /tmp/zex-ports-src/target
          else
            (cd /tmp/zex-ports-src && git pull --ff-only)
          fi
          (cd /tmp/zex-ports-src && cargo build --release)
          cp /tmp/zex-ports-src/target/release/zex-ports /usr/local/bin/zex-ports

      - name: Build + publish changed packages
        env:
          # github.event.before is the SHA the branch was at right before
          # this push — covers every commit in the push, not just the
          # last one. Without this, changed-packages.sh's HEAD~1 fallback
          # only ever sees the final commit's diff, so pushing several
          # commits at once (or the very first push of a repo's full
          # history, where `before` is the all-zero SHA and this env var
          # ends up empty, falling through to changed-packages.sh's own
          # HEAD~1 default) silently drops everything else.
          BASE_SHA: ${{ github.event.before }}
        run: |
          pkgs_out="$(mktemp)"
          if ! sh ci/changed-packages.sh > "$pkgs_out"; then
            echo "changed-packages.sh failed:"
            cat "$pkgs_out"
            exit 1
          fi
          failed=""
          first=1
          for pkg in $(cat "$pkgs_out"); do
            if [ "$first" -eq 0 ]; then
              echo "-- waiting 60s before the next package --"
              sleep 60
            fi
            first=0
            echo "=== release build: $pkg ==="
            sh ci/build.sh "$pkg" || failed="$failed $pkg"
          done
          if [ -n "$failed" ]; then
            echo "FAILED:$failed"
            exit 1
          fi

      - name: Upload staging on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zexbuild-staging
          path: .zexbuild-staging/
          retention-days: 1
