[package]
name             = "icu-dev"
version          = "79.1"
description      = "icu headers, pkgconfig"
license          = "Unicode-3.0"
maintainer       = "alizainx <heyalizain@gmail.com>"
homepage         = "https://icu.unicode.org"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["icu"]
provides         = ["icu-dev"]
tags             = ["library", "unicode", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
