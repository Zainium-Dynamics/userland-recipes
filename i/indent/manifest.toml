[package]
name             = "indent"
version          = "2.2.13"
description      = "GNU Indent — C source code formatter"
license          = "GPL-3.0-or-later"
maintainer       = "Ali Zain <heyalizain@gmail.com>"
homepage         = "https://www.gnu.org/software/indent/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["musl"]
provides         = ["indent"]
tags             = ["utility", "devtools"]

[install]
bin     = "/overlayer/zexlib/union/bin"
lib     = "/overlayer/zexlib/union/lib"
etc     = "/overlayer/zexlib/union/etc"
share   = "/overlayer/zexlib/union/share"
var     = "/overlayer/zexlib/union/var"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
