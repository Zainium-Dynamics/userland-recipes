[package]
name             = "which"
version          = "2.21"
description      = "GNU which — shows the full path of shell commands"
license          = "GPL-3.0-or-later"
maintainer       = "Ali Zain <heyalizain@gmail.com>"
homepage         = "https://www.gnu.org/software/which/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["musl"]
provides         = ["which"]
tags             = ["utility", "shell"]

[install]
bin     = "/overlayer/zexlib/union/bin"
lib     = "/overlayer/zexlib/union/lib"
etc     = "/overlayer/zexlib/union/etc"
share   = "/overlayer/zexlib/union/share"
var     = "/overlayer/zexlib/union/var"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
